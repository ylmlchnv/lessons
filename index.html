<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson Library</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f1ea;
      color: #1d1d1b;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 1.05rem;
    }

    .card {
      display: block;
      margin-top: 30px;
      padding: 24px;
      background: white;
      border: 1px solid #ddd6ca;
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .tag {
      font-size: 0.8rem;
      color: #8f1f23;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    h2 {
      margin: 8px 0;
      font-family: Georgia, serif;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Lesson Library</h1>
    <p>Interactive lessons and discussion materials.</p>

    <a class="card" href="1984/chapters-1-4/">
      <div class="tag">Literature · C1 · 90 min</div>
      <h2>1984 — Chapters 1–4</h2>
      <p>Discussion, historical context, surveillance, memory, propaganda and control.</p>
    </a>
  </div>
</body>
</html>
